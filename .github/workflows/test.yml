name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # README.md claims python>=3.11 support (numpy==2.3.4/scipy==1.16.2
        # in setup.py both require >=3.11 -- 3.10 has no matching wheels and
        # pip install fails outright there); keep this matrix in sync with
        # that claim rather than testing 3.12 alone.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install .

      - name: Smoke test
        run: DupCaller.py --help

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # README.md claims python>=3.11 support (numpy==2.3.4/scipy==1.16.2
        # in setup.py both require >=3.11 -- 3.10 has no matching wheels and
        # pip install fails outright there); keep this matrix in sync with
        # that claim rather than testing 3.12 alone.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install .[test]

      - name: Install tabix
        run: sudo apt-get update && sudo apt-get install -y tabix

      - name: Run unit tests
        run: pytest tests/unit/ -v

  mock-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment with pipeline dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: bioconda,conda-forge
          channel-priority: strict

      # bwa=0.7.17 and samtools/gatk4 keep landing on mutually
      # unsatisfiable pins when solved together (bwa needs an old
      # libzlib range; samtools needs an htslib/libdeflate combo that
      # keeps shifting as bioconda adds new builds, so a version pair
      # "verified" against today's channel snapshot can stop solving a
      # week later with no change on our end). Solve bwa in its own env,
      # isolated from samtools/gatk4's htslib chain entirely, and put
      # both envs' bin dirs on PATH.
      - name: Install bwa, samtools, gatk4
        run: |
          conda create -y -n bwa_env bwa=0.7.17
          conda create -y -n pipeline_env samtools gatk4=4.6.2.0
          echo "$(conda info --base)/envs/bwa_env/bin" >> "$GITHUB_PATH"
          echo "$(conda info --base)/envs/pipeline_env/bin" >> "$GITHUB_PATH"

      - name: Install DupCaller
        run: pip install .[test]

      # test_mock_pipeline_nextflow.py runs in the dedicated
      # mock-pipeline-nextflow job below, which installs nextflow and a
      # container runtime; it would otherwise silently skip here.
      - name: Run mock end-to-end pipeline test (direct CLI)
        run: |
          pytest tests/mock_pipeline/ -v \
            --ignore=tests/mock_pipeline/test_mock_pipeline_nextflow.py

  mock-pipeline-nextflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment with pipeline dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: bioconda,conda-forge
          channel-priority: strict

      # See the mock-pipeline job above for why bwa is solved in its own
      # env, isolated from samtools/gatk4.
      - name: Install bwa, samtools, gatk4
        run: |
          conda create -y -n bwa_env bwa=0.7.17
          conda create -y -n pipeline_env samtools gatk4=4.6.2.0
          echo "$(conda info --base)/envs/bwa_env/bin" >> "$GITHUB_PATH"
          echo "$(conda info --base)/envs/pipeline_env/bin" >> "$GITHUB_PATH"

      - name: Install Nextflow
        env:
          # Pinned so a Nextflow release change can't silently alter what
          # this job validates; nextflow/nextflow.config only requires
          # >=21.10.0, so bump this deliberately rather than floating it.
          NXF_VER: "24.10.4"
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      # ubuntu-latest runners ship Docker with a running daemon already;
      # this only verifies it, it doesn't install anything.
      - name: Verify Docker is available
        run: docker info

      - name: Install DupCaller
        run: pip install .[test]

      # The test itself skips (rather than fails) when nextflow/bwa/
      # samtools/a container runtime aren't on PATH, so that a laptop
      # without those tools doesn't get a spurious failure. In CI all of
      # them are guaranteed present by the steps above, so a skip here
      # means the job's own setup is broken, not an expected outcome --
      # treat it as a failure rather than letting the run go green on a
      # skip.
      - name: Run nextflow mock end-to-end pipeline test
        run: |
          set -o pipefail
          pytest tests/mock_pipeline/test_mock_pipeline_nextflow.py -v -rs \
            | tee pytest_nextflow.log
          if grep -q "SKIPPED" pytest_nextflow.log; then
            echo "::error::test_mock_pipeline_nextflow.py was skipped even though this job installs nextflow/bwa/samtools/docker -- fix the job setup rather than letting this pass on a skip."
            exit 1
          fi
