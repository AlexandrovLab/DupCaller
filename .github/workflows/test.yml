name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # setup.py's numpy/scipy pins require python >= 3.11.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install .

      - name: Smoke test
        run: DupCaller.py --help

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # setup.py's numpy/scipy pins require python >= 3.11.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install .[test]

      - name: Install tabix
        run: sudo apt-get update && sudo apt-get install -y tabix

      - name: Run unit tests
        run: pytest tests/unit/ -v

  mock-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment with pipeline dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: bioconda,conda-forge
          channel-priority: strict

      # The aligner is solved in its own env, isolated from samtools/
      # gatk4's htslib chain (whose libdeflate/zlib pins keep shifting as
      # bioconda adds builds), and both envs' bin dirs go on PATH.
      - name: Install bwa-mem2, samtools, gatk4
        run: |
          conda create -y -n bwa_env bwa-mem2=2.3
          conda create -y -n pipeline_env samtools gatk4=4.3.0.0
          echo "$(conda info --base)/envs/bwa_env/bin" >> "$GITHUB_PATH"
          echo "$(conda info --base)/envs/pipeline_env/bin" >> "$GITHUB_PATH"

      - name: Install DupCaller
        run: pip install .[test]

      # The nextflow test runs in the mock-pipeline-nextflow job below.
      - name: Run mock end-to-end pipeline test (direct CLI)
        run: |
          pytest tests/mock_pipeline/ -v \
            --ignore=tests/mock_pipeline/test_mock_pipeline_nextflow.py

  mock-pipeline-nextflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment with pipeline dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: bioconda,conda-forge
          channel-priority: strict

      - name: Install Nextflow
        env:
          # Pinned; bump deliberately (nextflow.config requires >=21.10.0).
          NXF_VER: "24.10.4"
        run: |
          # The installer writes ./nextflow, which would collide with the
          # repo's nextflow/ directory.
          mkdir -p "$RUNNER_TEMP/nextflow-install"
          cd "$RUNNER_TEMP/nextflow-install"
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      # ubuntu-latest already runs Docker; this only verifies it.
      - name: Verify Docker is available
        run: docker info

      - name: Install DupCaller
        run: pip install .[test]

      # The test skips when nextflow or a container runtime is missing; in
      # CI both are installed above, so treat a skip as a failure.
      - name: Run nextflow mock end-to-end pipeline test
        run: |
          set -o pipefail
          pytest tests/mock_pipeline/test_mock_pipeline_nextflow.py -v -rs \
            | tee pytest_nextflow.log
          if grep -q "SKIPPED" pytest_nextflow.log; then
            echo "::error::test_mock_pipeline_nextflow.py was skipped even though this job installs nextflow/docker -- fix the job setup rather than letting this pass on a skip."
            exit 1
          fi
