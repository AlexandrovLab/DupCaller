name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install .

      - name: Smoke test
        run: DupCaller.py --help

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install .[test]

      - name: Install tabix
        run: sudo apt-get update && sudo apt-get install -y tabix

      - name: Run unit tests
        run: pytest tests/unit/ -v

  mock-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment with pipeline dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: bioconda,conda-forge
          channel-priority: strict

      # samtools>=1.21 requires libzlib>=1.3.1, but bwa=0.7.17's only
      # available builds all require libzlib<1.3.0a0 -- no single zlib
      # satisfies both, so the solver either hangs (classic) or reports
      # LibMambaUnsatisfiableError (libmamba) if paired with samtools
      # 1.21+. samtools=1.20 is the newest release still built against
      # the older libzlib range bwa 0.7.17 needs; verified installable
      # together with gatk4=4.6.2.0 (libmamba solve, ~1m40s).
      - name: Install bwa, samtools, gatk4
        run: conda install -y bwa=0.7.17 samtools=1.20 gatk4=4.6.2.0

      - name: Install DupCaller
        run: pip install .[test]

      - name: Run mock end-to-end pipeline test
        run: pytest tests/mock_pipeline/ -v
